<!DOCTYPE html>
<!-- Declara que este documento usa HTML5 -->
<html lang="pt-BR">
    <!-- html=Elemento raiz da página. lang= "pt-BR" define o idioma -->

     <!-- tudo que é azul escuro é tag, azul claro é atributo -->
<head>
    <!-- Informações de bastidores: não aparecem diretamente na tela -->

    <meta charset="UTF-8"> <!--Codificação de caracteres, garante acentos corretos (Diciónario do html) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ativa a responsividade em dispositivos móveis-->

    <title>Escola Digital Livre</title>  
<!-- Título da página -->

   <link rel="stylesheet" href="style.css">
   <!-- Conect o arquivo de estilos (CSS) -->

</head>

<body>
    <!--  Tudo que o usuário vê e interage fica aqui -->


    <header class="header"> <!--tag semântica: indica o cabeçalho da página--> 

        <div class="header-container">
        <!-- Container que agrupa e centraliza o conteúdo do header -->

            <a href="#" class="logo">
                <!-- Logo clicável, leva para o home -->

                 <img src="./assets/image-removebg-preview (1).png" alt="Logo Educação Digital Livre" width="60px">
                 <!-- img: adiciona imagem / src: caminho da imagem / alt: legenda da imagem / widht: tamanho da imagem-->
                <!-- adicionar imagem na minha página --> <!-- src= camiho para imagem--> <!-- alt= alternativa, quando a página não carregar-->

                <span class="logo-text">
                    <!-- span: elemento de texto inline, não quebra linha sozinha -->
                    <span class="logo-title">Escola Digital Livre</span>
                    <span class="logo-subtitle">Tecnologia para todos</span>
                </span>
            </a>

            <nav class="main-nav">
                <!-- tag semântica para o menu de navegação -->
                 <a href="index.html" class="nav-link active">Início</a>
                 <!--  a (link) para navegação, href é o caminho da página, "active" destaca a página atual -->

                 <a href="cursos.html" class="nav-link">Cursos</a>
                 <a href="#" class="nav-link">Sobre</a>
                 <a href="#" class="nav-link">Contatos</a>

              
            </nav>
            <div class="header-actions">
                <!-- Agrupa os botões de busca e botão CTA -->

                <div class="search-box">
                    <input type="text" placeholder="Buscar cursos...">
                    <!--input campo de entrada / placeholder some assim que o usuário digita --> 
                         <img src="assets/search-svgrepo-com.svg" alt="ícone de pesquisa" width="30">
                         <!-- ícone vetorial da lupa -->
                </div>

                <button class="btn-primary">Começar agora</button>
                <!-- Botões para ações na página -->
            </div>



        </div>


    </header> <!--tag de fechamento, diferencia com "/"-->
</body>
</html>
